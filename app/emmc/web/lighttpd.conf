# crustys lighttpd config, all it does is serve /system/homepage on port 80.
# crestrons config redirected / to its own banner page and waited for its CPH daemon, we dont need any of that.
server.document-root   = "/system/homepage"
server.port            = 80
server.tag             = "crusty"
server.errorlog        = "/dev/shm/web/error.log"
server.errorfile-prefix = "/system/homepage/errors/status-"
server.max-connections = 64
index-file.names       = ( "index.html" )
dir-listing.activate   = "disable"
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".htm"  => "text/html; charset=utf-8",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".txt"  => "text/plain; charset=utf-8",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif"  => "image/gif",
    ".svg"  => "image/svg+xml",
    ".ico"  => "image/x-icon",
    ".woff2" => "font/woff2",
)

# android settings that tools/mod-data.py writes offline into /data
# [secure] / [global] / [system] -> /data/data/com.android.providers.settings/databases/settings.db
# [locksettings]                 -> /data/system/locksettings.db (user 0)

[locksettings]
# no lock screen (= Settings > Security > Screen lock > None)
# the panels framework has the keyguard ripped out anyway (PhoneWindowManager.mKeyguardDelegate == null), this is only here so it all agrees.
lockscreen.disabled = 1

[secure]
lockscreen.disabled = 1
# crustys key filtering accessibility service (side buttons, the Home workaround)
enabled_accessibility_services = dev.crusty.companion/dev.crusty.companion.ButtonService
accessibility_enabled = 1

[system]
# NEVER let android put the screen to sleep, its early-suspend holds the touch controller in reset and then neither the side buttons nor the screen can wake the panel (eternal sleep, lol)
# the crusty companion enforces this too and does "screen off" itself (power button).
screen_off_timeout = 2147483647
